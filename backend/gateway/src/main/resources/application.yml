server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: identity
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
        - id: payment
          uri: http://localhost:8083
          predicates:
              - Path=/api/exhibitor/payments/**,/api/customer/admission-payments/**
        - id: expo-customer
          uri: http://localhost:8082
          predicates:
              - Path=/api/customer/expos/**,/api/customer/consultations/**
        # expo의 "/api/admin/**"보다 먼저 와야 함 - 안 그러면 이 경로가 expo로 잘못 라우팅됨
        - id: reservation
          uri: http://localhost:8084
          predicates:
            - Path=/api/admin/reservation/**,/api/customer/**
        - id: expo
          uri: http://localhost:8082
          predicates:
            - Path=/api/admin/**,/api/exhibitor/**
        # 부스 배너/차량 이미지 등 업로드 파일. <img> 태그는 Authorization 헤더를 못 실어서 화이트리스트 처리됨
        - id: expo-uploads
          uri: http://localhost:8082
          predicates:
            - Path=/uploads/**
        # Swagger UI가 각 서비스 OpenAPI 문서를 게이트웨이 경유로 가져오게 함
        - id: openapi-identity
          uri: http://localhost:8081
          predicates: # 이 경로로 온 요청을 잡아서
            - Path=/v3/api-docs/identity
          filters: # 경로를 이걸로 바꿔서 8081로 보냄
            - SetPath=/v3/api-docs
        - id: openapi-expo
          uri: http://localhost:8082
          predicates:
            - Path=/v3/api-docs/expo
          filters:
            - SetPath=/v3/api-docs
        - id: openapi-payment
          uri: http://localhost:8083
          predicates:
            - Path=/v3/api-docs/payment
          filters:
            - SetPath=/v3/api-docs
        - id: openapi-reservation
          uri: http://localhost:8084
          predicates:
            - Path=/v3/api-docs/reservation
          filters:
            - SetPath=/v3/api-docs
      globalcors: # gateway CORS 설정
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:5174"
              - "http://localhost:3000"
            allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowedHeaders: "*"
            allowCredentials: true

springdoc:
  swagger-ui:
    urls:
      - name: identity
        url: /v3/api-docs/identity
      - name: expo
        url: /v3/api-docs/expo
      - name: payment
        url: /v3/api-docs/payment
      - name: reservation
        url: /v3/api-docs/reservation

jwt:
  access-key: ${ACCESS_KEY}
