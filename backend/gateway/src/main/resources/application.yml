server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: identity
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
        - id: payment
          uri: http://localhost:8083
          predicates:
            - Path=/api/exhibitor/payments/**
        - id: expo
          uri: http://localhost:8082
          predicates:
            - Path=/api/admin/expos/**,/api/exhibitor/**
      globalcors: # gateway CORS 설정
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:3000"
            allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowedHeaders: "*"
            allowCredentials: true

jwt:
  access-key: ${ACCESS_KEY}
