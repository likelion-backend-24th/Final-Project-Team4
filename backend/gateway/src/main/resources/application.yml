server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: identity
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
        - id: payment
          uri: http://localhost:8083
          predicates:
              - Path=/api/exhibitor/payments/**,/api/customer/admission-payments/**
        - id: expo-customer
          uri: http://localhost:8082
          predicates:
              - Path=/api/customer/expos/**
        # expo의 "/api/admin/**"보다 먼저 와야 함 - 안 그러면 이 경로가 expo로 잘못 라우팅됨
        - id: reservation
          uri: http://localhost:8084
          predicates:
            - Path=/api/admin/reservation/**,/api/customer/**
        - id: expo
          uri: http://localhost:8082
          predicates:
            - Path=/api/admin/**,/api/exhibitor/**
        # 부스 배너/차량 이미지 등 업로드 파일. <img> 태그는 Authorization 헤더를 못 실어서 화이트리스트 처리됨
        - id: expo-uploads
          uri: http://localhost:8082
          predicates:
            - Path=/uploads/**
      globalcors: # gateway CORS 설정
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:5174"
              - "http://localhost:3000"
            allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowedHeaders: "*"
            allowCredentials: true

jwt:
  access-key: ${ACCESS_KEY}
