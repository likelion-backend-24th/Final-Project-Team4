server:
  port: 8082

spring:
  application:
    name: expo
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/expo?serverTimezone=UTC&characterEncoding=UTF-8&rewriteBatchedStatements=true
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:app_local_only}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

# 내부 서비스 간 호출(/internal/**) 인증용. Gateway·OpenAPI에 미노출.
service:
  token:
    payment: ${SVC_TOKEN_PAYMENT:local_dev_payment_token}
    reservation: ${SVC_TOKEN_RESERVATION:local_dev_reservation_token}

springdoc:
  paths-to-exclude: /internal/** # 서비스 간 내부 호출 - 외부 API 문서에서 제외

payment:
  base-url: ${PAYMENT_BASE_URL:http://localhost:8083}

# 상담 신청 접수 시점에 그 날짜 입장권(QR) 보유 여부 확인용 (Expo -> Reservation 내부 호출)
reservation:
  base-url: ${RESERVATION_BASE_URL:http://localhost:8084}
  service-token: ${SVC_TOKEN_EXPO:local_dev_expo_token}

identity:
  base-url: ${IDENTITY_BASE_URL:http://localhost:8081}
  service-token: ${SVC_TOKEN_EXPO:local_dev_expo_token}

# 상담 신청 접수 시 참가업체가 보기 쉽게 요청 내용을 요약(Gemini). 키가 없으면 요약 없이(null) 정상 동작 - 필수 기능 아님.
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.5-flash-lite}