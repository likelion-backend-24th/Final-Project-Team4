server:
  port: 8082

spring:
  application:
    name: expo
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/expo?serverTimezone=UTC&characterEncoding=UTF-8&rewriteBatchedStatements=true
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:app_local_only}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

# 내부 서비스 간 호출(/internal/**) 인증용. Gateway·OpenAPI에 미노출.
service:
  token:
    payment: ${SVC_TOKEN_PAYMENT:local_dev_payment_token}

payment:
  base-url: ${PAYMENT_BASE_URL:http://localhost:8083}
