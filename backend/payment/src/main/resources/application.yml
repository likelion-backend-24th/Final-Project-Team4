server:
  port: 8083

spring:
  application:
    name: payment
  profiles:
    active: reservation
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/payment?serverTimezone=UTC&characterEncoding=UTF-8&rewriteBatchedStatements=true
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:app_local_only}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

portone:
  api-secret: ${PORTONE_API_SECRET:}

expo:
  base-url: ${EXPO_BASE_URL:http://localhost:8082}
  service-token: ${SVC_TOKEN_PAYMENT:local_dev_payment_token}

reservation:
  base-url: ${RESERVATION_BASE_URL:http://localhost:8084}
  service-token: ${SVC_TOKEN_PAYMENT:local_dev_payment_token}