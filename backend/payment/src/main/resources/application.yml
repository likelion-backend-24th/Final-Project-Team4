server:
  port: 8083

spring:
  application:
    name: payment
  datasource:
    url: jdbc:h2:mem:paymentdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true

portone:
  api-secret: ${PORTONE_API_SECRET}

expo:
  base-url: ${EXPO_BASE_URL:http://localhost:8082}
  service-token: ${SVC_TOKEN_PAYMENT:local_dev_payment_token}