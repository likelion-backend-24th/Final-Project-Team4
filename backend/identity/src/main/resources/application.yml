server:
  port: 8081

spring:
  application:
    name: identity
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/identity?serverTimezone=Asia%2FSeoul&characterEncoding=UTF-8&rewriteBatchedStatements=true
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:app_local_only}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis_local_only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-name: Google
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

          kakao:
            client-name: Kakao
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post # 인가 코드를 액세스 토큰으로 교환할 때(token-uri 호출), 우리 서버가 자기 자신을 카카오한테 어떤 방식으로 인증하는지.
                                                             # 카카오는 기본값인 client_secret_basic(Authorization 헤더에 실어 보내는 방식)을 지원 안 해서 이걸 명시해야함.
            authorization-grant-type: authorization_code # 표준 OAuth2 인가 코드 흐름(로그인 화면 리다이렉트 -> 코드 받음 -> 코드를 토큰으로 교환)
                                                         # 구글은 Spring이 내장 provider로 알고 있어서 이 값이 기본으로 채워지지만,
                                                         # 카카오,네이버 처럼 직접 provider: 블록을 정의하는 제공자는 Spring이 기본값을 모르니 명시적으로 적어줘야 함.
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}" # {baseUrl} - 실행 중인 서버 주소, {registrationId} - 블록 이름(kakao)으로 Spring이 런타임에 치환.
            scope:
              - profile_nickname
              - account_email

          naver:
            client-name: Naver
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - name
              - email

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response



jwt:
  access-key: ${ACCESS_KEY}
  refresh-key: ${REFRESH_KEY}
  accessTokenExp: 900000 # 15분
  refreshTokenExp: 1209600000 # 2주

admin:
  email: ${ADMIN_EMAIL:admin@admin.com}
  password: ${ADMIN_PASSWORD:admin}

cookie:
  secure: ${COOKIE_SECURE:false} # 운영 환경에서 true
  same-site: ${COOKIE_SAMESITE:Strict}

# 비밀번호 재설정 메일 링크 프론트 주소
app:
  frontend-url: ${FRONT_ORIGIN:http://localhost:5173}
  mail:
    provider: ${MAIL_PROVIDER:log} # log(기본) | smtp

# 내부 서비스 간 호출(/internal/**) 인증용. Gateway·OpenAPI에 미노출.
service:
  token:
    expo: ${SVC_TOKEN_EXPO:local_dev_expo_token}

springdoc:
  paths-to-exclude: /internal/** # 서비스 간 내부 호출 - 외부 API 문서에서 제외

# 부스 상세(배정 참가업체 회사명/업종) 조회용 - Expo -> Identity
identity:
  base-url: ${IDENTITY_BASE_URL:http://localhost:8081}
  service-token: ${SVC_TOKEN_EXPO:local_dev_expo_token}