server:
  port: 8081

spring:
  application:
    name: identity
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/identity?serverTimezone=UTC&characterEncoding=UTF-8&rewriteBatchedStatements=true
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:app_local_only}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis_local_only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  access-key: ${ACCESS_KEY}
  refresh-key: ${REFRESH_KEY}
  accessTokenExp: 900000 # 15분
  refreshTokenExp: 1209600000 # 2주

admin:
  email: ${ADMIN_EMAIL:admin@admin.com}
  password: ${ADMIN_PASSWORD:admin}

cookie:
  secure: ${COOKIE_SECURE:false} # 운영 환경에서 true
  same-site: ${COOKIE_SAMESITE:Strict}

# 비밀번호 재설정 메일 링크 프론트 주소
app:
  frontend-url: ${FRONT_ORIGIN:http://localhost:5173}
  mail:
    provider: ${MAIL_PROVIDER:log} # log(기본) | smtp

# 내부 서비스 간 호출(/internal/**) 인증용. Gateway·OpenAPI에 미노출.
service:
  token:
    expo: ${SVC_TOKEN_EXPO:local_dev_expo_token}

springdoc:
  paths-to-exclude: /internal/** # 서비스 간 내부 호출 - 외부 API 문서에서 제외

# 부스 상세(배정 참가업체 회사명/업종) 조회용 - Expo -> Identity
identity:
  base-url: ${IDENTITY_BASE_URL:http://localhost:8081}
  service-token: ${SVC_TOKEN_EXPO:local_dev_expo_token}