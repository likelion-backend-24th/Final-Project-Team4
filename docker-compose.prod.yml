name: car-expo-prod

services:
  mysql:
    image: mysql:8.0
    container_name: car-expo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: app
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 3s
      retries: 15
    networks:
      - backend

  redis:
    image: redis:7.4-alpine
    container_name: car-expo-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 15
    networks:
      - backend

  identity:
    image: ghcr.io/likelion-backend-24th/team4-identity:${IMAGE_TAG:-latest}
    container_name: car-expo-identity
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: app
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: None
      SPRING_JPA_SHOW_SQL: "false"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

  expo:
    image: ghcr.io/likelion-backend-24th/team4-expo:${IMAGE_TAG:-latest}
    container_name: car-expo-expo
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: app
      PAYMENT_BASE_URL: http://payment:8083
      RESERVATION_BASE_URL: http://reservation:8084
      SPRING_JPA_SHOW_SQL: "false"
    volumes:
      - expo-uploads:/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend

  reservation:
    image: ghcr.io/likelion-backend-24th/team4-reservation:${IMAGE_TAG:-latest}
    container_name: car-expo-reservation
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: app
      EXPO_BASE_URL: http://expo:8082
      SPRING_JPA_SHOW_SQL: "false"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend

  payment:
    image: ghcr.io/likelion-backend-24th/team4-payment:${IMAGE_TAG:-latest}
    container_name: car-expo-payment
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: app
      EXPO_BASE_URL: http://expo:8082
      RESERVATION_BASE_URL: http://reservation:8084
      SPRING_JPA_SHOW_SQL: "false"
    networks:
      - backend
    depends_on:
      mysql:
        condition: service_healthy

  gateway:
    image: ghcr.io/likelion-backend-24th/team4-gateway:${IMAGE_TAG:-latest}
    container_name: car-expo-gateway
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      - identity
      - expo
      - payment
      - reservation
    networks:
      - backend

  nginx:
    image: nginx:1.27-alpine
    container_name: car-expo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro # 호스트 certbot이 발급
      - /var/www/certbot:/var/www/certbot:ro # ACME webroot 갱신용
    depends_on:
      - gateway
    networks:
      - backend

volumes:
  mysql-data:
  redis-data:
  expo-uploads:

networks:
  backend:
