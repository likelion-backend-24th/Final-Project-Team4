name: CI

on:
  push:
    branches: [dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start MySQL, Redis
        run: docker compose up -d --wait
        env:
          DB_ROOT_PASSWORD: root
          DB_PASSWORD: app_local_only
          REDIS_PASSWORD: redis_local_only

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run tests
        working-directory: backend
        run: chmod +x gradlew && ./gradlew test --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: backend/*/build/reports/tests/test
          retention-days: 7

  build-push:
    needs: test
    if: github.event_name == 'push'   # dev 머지분만 이미지 빌드
    runs-on: ubuntu-24.04-arm         # ARM64
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [gateway, identity, expo, payment, reservation]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          build-args: MODULE=${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/team4-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/team4-${{ matrix.service }}:${{ github.sha }}
